[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelguard"
version = "0.1.0"
description = "Bounded static GGUF, safetensors and chat-template inspection"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
modelguard = "modelguard.cli:main"

[tool.setuptools.packages.find]
include = ["modelguard*"]

[tool.setuptools.package-data]
modelguard = ["data/templates/*.jinja", "data/templates/*.json", "data/templates/LICENSE.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

